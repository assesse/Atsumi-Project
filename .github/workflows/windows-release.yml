name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build signed updater artifacts
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    env:
      CI: true
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = ((Get-Content src-tauri/Cargo.toml | Select-String '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value)
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Release versions differ: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME must match v$packageVersion"
          }

      - name: Install Rust stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustc +stable --version
          cargo +stable --version

      - name: Build draft release and updater metadata
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Atsumi v__VERSION__
          releaseBody: |
            Atsumi Windows update.

            This build is unsigned for Windows Authenticode. The in-app updater
            still verifies the artifact with the Atsumi updater key.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: Atsumi-Setup[ext]

      - name: Remove standalone updater signature asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release delete-asset "v$packageVersion" "Atsumi-Setup.exe.sig" --repo "$env:GITHUB_REPOSITORY" --yes
