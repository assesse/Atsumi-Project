name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build signed updater artifacts
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    env:
      CI: true
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = ((Get-Content src-tauri/Cargo.toml | Select-String '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value)
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Release versions differ: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME must match v$packageVersion"
          }

      - name: Install Rust stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustc +stable --version
          cargo +stable --version

      - name: Prepare pinned recording merge tools
        run: ./tools/prepare_media_tools.ps1

      - name: Build signed installer and portable packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          pnpm exec tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed' }
          ./tools/prepare_portable.ps1
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          pnpm exec tauri signer sign --password= ".runtime/portable-v$version/Atsumi-Portable.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Portable signing failed' }
          node tools/prepare_release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }

      - name: Upload verified draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $existing = gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              Write-Output 'Release already published; immutable public assets were not changed.'
              exit 0
            }
          } else {
            gh release create "v$version" --verify-tag --draft --title "Atsumi v$version" --notes-file "docs/releases/v$version.md" --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          }
          gh release upload "v$version" ".runtime/release-v$version/Atsumi-Setup.exe" ".runtime/release-v$version/Atsumi-Portable.zip" ".runtime/release-v$version/latest.json" --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
