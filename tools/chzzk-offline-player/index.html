<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHZZK 원본 플레이어 · 로컬 테스트</title><link rel="stylesheet" href="/demo.css"></head>
<body>
  <header><div><h1>CHZZK 원본 플레이어 · 채팅</h1><p>오프라인 테스트 · PC 1.16.2 · 방송 정보와 채팅은 샘플 데이터</p></div><span class="local-state">LOCAL FILES ONLY</span></header>
  <nav aria-label="테스트 화면"><button id="live" aria-pressed="true">라이브 UI</button><button id="vod" aria-pressed="false">녹화본 UI</button><button id="chat-toggle" aria-pressed="true">채팅</button><button id="reopen">새로 열기</button><button id="network-test">외부 연결 차단 확인</button><span id="status" role="status">원본 로딩 중…</span></nav>
  <main id="stage"><div id="video-host"><iframe id="player" title="CHZZK 원본 플레이어" sandbox="allow-scripts" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div><iframe id="chat" title="CHZZK 원본 라이브 채팅" sandbox="allow-scripts"></iframe></main>
  <footer><p>‘녹화본 UI’에서는 기존 채팅 입력창으로 본문·닉네임을 검색할 수 있습니다. 방송 정보와 60개 채팅은 로컬 샘플입니다. 실제 녹화 파일·로그인·메시지 전송·후원은 연결하지 않았습니다.</p><span id="chat-status" role="status"></span><details><summary>로컬 파일·검증 기록</summary><pre id="proof">확인 중</pre><pre id="events"></pre></details></footer>
  <script type="module" src="/demo.js"></script>
</body></html>
